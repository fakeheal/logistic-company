<!--/*@thymesVar id="form" type="nbu.team11.controllers.forms.CreateOfficeForm"*/-->
<!--/*@thymesVar id="office" type="nbu.team11.dtos.OfficeDto"*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="officeEditPage">
    <form class="max-w-lg mx-auto my-24 p-6 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700"
          method="post"
          th:action="@{'/office/' + ${office.getId()} + '/update'}"
          th:object="${form}">

        <h2 class="font-bold text-xl mb-6 dark:text-white">Edit Office</h2>

        <div class="mb-5"
             th:insert="~{ /ui/forms :: textInput(labelText='Title', inputName='title', inputType='text') }"></div>

        <div class="mb-5"
             th:insert="~{ /ui/forms :: textInput(labelText='Address', inputName='formattedAddress', inputType='text') }"></div>

        <div class="mb-5">
            <label for="coordinates"
                   class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                Coordinates
            </label>
            <input type="text"
                   id="coordinates"
                   name="coordinates"
                   th:classappend="${#fields.hasErrors('coordinates')} ? 'bg-red-50 border border-red-500 text-red-900 placeholder-red-700 focus:ring-red-500 dark:bg-gray-700 dark:text-red-500 dark:placeholder-red-500 dark:border-red-500 focus:border-red-500' : 'bg-gray-50 border border-gray-300 text-gray-900 text-sm focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-blue-500 dark:focus:border-blue-500'"
                   class="block w-full p-2.5 dark:text-white rounded-lg"
                   th:value="*{coordinates}"
                   placeholder="e.g., 42.6977,23.3219"
            />
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Format: latitude,longitude</p>
            <p th:if="${#fields.hasErrors('coordinates')}"
               th:errors="*{coordinates}"
               class="mt-2 text-sm text-red-600 dark:text-red-500">
                Coordinates Error
            </p>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center space-y-2 md:space-y-0 mt-6">
            <button type="submit"
                    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                Update Office
            </button>

            <a href="/office" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
