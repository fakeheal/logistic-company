<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Register</title>
    <style>
        .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .form-container {
        background-color: #fff;
        padding: 30px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin: 10px;
        width: 400px; /* Adjust the width as per your preference */
      }

      h2 {
        text-align: center;
        color: #5e057e;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #5e057e;
        font-weight: bold;
      }

      input[type="text"],
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-weight: bold;
      }

      button[type="submit"] {
        background-color: #5e057e;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
      }

      button[type="submit"]:hover {
        background-color: #c299d0;
      }

      .success-message {
        background-color: #5e057e;
        color: #fff;
        padding: 10px;
        border-radius: 3px;
        text-align: center;
      }



    </style>
</head>
<body>

<div class="container">
    <div class="form-container">


        <div th:if="${param.success}">
            <div class="success-message">
                <p>Registration Successful!</p>
            </div>
        </div>

        <h2>Registration</h2>
        <form
                method="post"
                role="form"
                th:action="@{/register}"
                th:object="${user}"


        >

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input th:field="*{firstName}" type="text" id="firstName" name="firstName" placeholder="First name" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input th:field="*{lastName}" type="text" id="lastName" name="lastName" placeholder="Last name" required>
            </div>
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input th:field="*{clientDto.phoneNumber}" id="phoneNumber" name="phoneNumber" placeholder="Phone number" required>
            </div>
            <div class="form-group">
                <label for="autocomplete">Address</label>
                <input id="autocomplete" type="text"
                       placeholder="Start typing your address"
                       required>
            </div>
            <input type="hidden"
                   th:field="*{clientDto.addressDto.formattedAddress}"
                   id="formattedAddress">
            <input type="hidden"
                   th:field="*{clientDto.addressDto.coordinates}"
                   id="coordinates">
            <div class="form-group">
                <label for="email">Email</label>
                <input th:field="*{email}" type="text" id="email" name="email" placeholder="Enter your email address" required>
                <span th:if="${userexist}" style="color: red;">There is already registration with this email.</span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input th:field="*{password}" type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <span> Already Registered <a th:href="@{/login}">Login</a></span>
    </div>
</div>
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>
<script>
    function initAutocomplete() {
      const input = document.getElementById('autocomplete');
      const autocomplete = new google.maps.places.Autocomplete(input, {
        types: ['geocode']
      });
      autocomplete.addListener('place_changed', () => {
        const place = autocomplete.getPlace();
        document.getElementById('formattedAddress')
                .value = place.formatted_address;
        const lat = place.geometry.location.lat();
        const lng = place.geometry.location.lng();
        document.getElementById('coordinates')
                .value = lat + ',' + lng;
      });
    }
    // init on load
    window.addEventListener('load', initAutocomplete);
</script>


</body>
</html>
