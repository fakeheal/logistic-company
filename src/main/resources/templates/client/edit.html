<!--/*@thymesVar id="form" type="nbu.team11.controllers.forms.EditClientForm"*/-->
<!--/*@thymesVar id="client" type="nbu.team11.dtos.ClientDto"*/-->
<!--/*@thymesVar id="addressLinkedToShipment" type="java.util.Map<Integer, Boolean>"*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="clientEditPage">
    <div class="container my-6 lg:my-12 mx-auto max-w-2xl">
        <div class="bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700 p-6">
            <h2 class="font-bold text-xl mb-6 dark:text-white">Edit Client</h2>

            <div th:if="${errorMessage}" class="mb-4 p-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
                <span th:text="${errorMessage}">Error message</span>
            </div>

            <form method="post"
                  th:action="@{'/client/' + ${client.getId()} + '/update'}"
                  th:object="${form}">

                <div class="mb-5"
                     th:insert="~{ /ui/forms :: textInput(labelText='First Name', inputName='firstName', inputType='text') }"></div>
                <div class="mb-5"
                     th:insert="~{ /ui/forms :: textInput(labelText='Last Name', inputName='lastName', inputType='text') }"></div>
                <div class="mb-5"
                     th:insert="~{ /ui/forms :: textInput(labelText='Email', inputName='email', inputType='email') }"></div>
                <div class="mb-5"
                     th:insert="~{ /ui/forms :: textInput(labelText='Phone Number', inputName='phoneNumber', inputType='text') }"></div>

                <div class="border-t border-gray-200 dark:border-gray-700 my-6 pt-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold text-lg dark:text-white">Addresses</h3>
                        <button type="button" onclick="addAddress()"
                                class="text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
                            + Add Address
                        </button>
                    </div>

                    <div id="addresses-container">
                        <th:block th:each="address, addressStat : *{addresses}">
                            <div th:id="'address-' + ${addressStat.index}" class="address-entry p-4 border border-gray-200 rounded-lg mb-4 dark:border-gray-700"
                                 th:classappend="${address.markedForDeletion} ? 'hidden' : ''">
                                <input type="hidden" th:name="'addresses[' + ${addressStat.index} + '].id'" th:value="${address.id}" />
                                <input type="hidden" th:name="'addresses[' + ${addressStat.index} + '].markedForDeletion'" th:value="${address.markedForDeletion}" th:id="'markedForDeletion-' + ${addressStat.index}" />

                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-sm font-medium text-gray-600 dark:text-gray-400" th:text="'Address #' + (${addressStat.index} + 1)">Address #1</span>
                                    <th:block th:if="${address.id != null}">
                                        <th:block th:if="${addressLinkedToShipment != null && addressLinkedToShipment.get(address.id) == true}">
                                            <span class="text-xs text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 px-2 py-1 rounded">
                                                Linked to shipment(s) - cannot modify
                                            </span>
                                        </th:block>
                                        <th:block th:unless="${addressLinkedToShipment != null && addressLinkedToShipment.get(address.id) == true}">
                                            <button type="button" th:onclick="'removeAddress(' + ${addressStat.index} + ')'"
                                                    class="text-red-600 hover:text-red-800 text-sm">
                                                Remove
                                            </button>
                                        </th:block>
                                    </th:block>
                                    <th:block th:if="${address.id == null}">
                                        <button type="button" th:onclick="'removeAddress(' + ${addressStat.index} + ')'"
                                                class="text-red-600 hover:text-red-800 text-sm">
                                            Remove
                                        </button>
                                    </th:block>
                                </div>

                                <div class="mb-3">
                                    <label th:for="'addresses[' + ${addressStat.index} + '].formattedAddress'"
                                           class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                        Formatted Address
                                    </label>
                                    <input type="text"
                                           th:name="'addresses[' + ${addressStat.index} + '].formattedAddress'"
                                           th:id="'addresses[' + ${addressStat.index} + '].formattedAddress'"
                                           th:value="${address.formattedAddress}"
                                           th:readonly="${address.id != null && addressLinkedToShipment != null && addressLinkedToShipment.get(address.id) == true}"
                                           th:classappend="${address.id != null && addressLinkedToShipment != null && addressLinkedToShipment.get(address.id) == true} ? 'bg-gray-100 cursor-not-allowed' : ''"
                                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
                                </div>

                                <div>
                                    <label th:for="'addresses[' + ${addressStat.index} + '].coordinates'"
                                           class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                        Coordinates
                                    </label>
                                    <input type="text"
                                           th:name="'addresses[' + ${addressStat.index} + '].coordinates'"
                                           th:id="'addresses[' + ${addressStat.index} + '].coordinates'"
                                           th:value="${address.coordinates}"
                                           th:readonly="${address.id != null && addressLinkedToShipment != null && addressLinkedToShipment.get(address.id) == true}"
                                           th:classappend="${address.id != null && addressLinkedToShipment != null && addressLinkedToShipment.get(address.id) == true} ? 'bg-gray-100 cursor-not-allowed' : ''"
                                           placeholder="42.6977,23.3219"
                                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
                                </div>
                            </div>
                        </th:block>
                    </div>

                    <div id="no-addresses-message" class="text-gray-500 dark:text-gray-400 text-sm"
                         th:classappend="${form.addresses != null && !form.addresses.isEmpty()} ? 'hidden' : ''">
                        No addresses added yet.
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-center space-y-2 md:space-y-0 pt-4">
                    <button type="submit"
                            class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                        Update Client
                    </button>

                    <a th:href="'/client/' + ${client.getId()}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        let addressIndex = [[${form.addresses != null ? form.addresses.size() : 0}]];

        function addAddress() {
            const container = document.getElementById('addresses-container');
            const noAddressesMsg = document.getElementById('no-addresses-message');

            const addressHtml = `
                <div id="address-${addressIndex}" class="address-entry p-4 border border-gray-200 rounded-lg mb-4 dark:border-gray-700">
                    <input type="hidden" name="addresses[${addressIndex}].id" value="" />
                    <input type="hidden" name="addresses[${addressIndex}].markedForDeletion" value="false" id="markedForDeletion-${addressIndex}" />

                    <div class="flex justify-between items-start mb-3">
                        <span class="text-sm font-medium text-gray-600 dark:text-gray-400">New Address</span>
                        <button type="button" onclick="removeAddress(${addressIndex})"
                                class="text-red-600 hover:text-red-800 text-sm">
                            Remove
                        </button>
                    </div>

                    <div class="mb-3">
                        <label for="addresses[${addressIndex}].formattedAddress"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Formatted Address
                        </label>
                        <input type="text"
                               name="addresses[${addressIndex}].formattedAddress"
                               id="addresses[${addressIndex}].formattedAddress"
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                               required />
                    </div>

                    <div>
                        <label for="addresses[${addressIndex}].coordinates"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Coordinates
                        </label>
                        <input type="text"
                               name="addresses[${addressIndex}].coordinates"
                               id="addresses[${addressIndex}].coordinates"
                               placeholder="42.6977,23.3219"
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                               required />
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', addressHtml);
            noAddressesMsg.classList.add('hidden');
            addressIndex++;
        }

        function removeAddress(index) {
            const addressDiv = document.getElementById('address-' + index);
            const markedForDeletionInput = document.getElementById('markedForDeletion-' + index);

            if (markedForDeletionInput) {
                markedForDeletionInput.value = 'true';
            }

            if (addressDiv) {
                addressDiv.classList.add('hidden');
            }

            // Check if there are any visible addresses left
            const visibleAddresses = document.querySelectorAll('.address-entry:not(.hidden)');
            if (visibleAddresses.length === 0) {
                document.getElementById('no-addresses-message').classList.remove('hidden');
            }
        }
    </script>
</div>
</body>
</html>
