<!--/*@thymesVar id="form" type="nbu.team11.controllers.forms.CreateClientForm"*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="clientCreatePage">
    <form class="max-w-sm mx-auto my-24 p-6 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700"
          method="post"
          th:action="@{/client/store}"
          th:object="${form}">

        <h2 class="font-bold text-xl mb-4 dark:text-white">New Client</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
            A password will be automatically generated and sent to the client's email address.
        </p>
        <div class="mb-5"
             th:insert="~{ /ui/forms :: textInput(labelText='First Name', inputName='firstName', inputType='text') }"></div>
        <div class="mb-5"
             th:insert="~{ /ui/forms :: textInput(labelText='Last Name', inputName='lastName', inputType='text') }"></div>
        <div class="mb-5"
             th:insert="~{ /ui/forms :: textInput(labelText='Email', inputName='email', inputType='email') }"></div>
        <div class="mb-5"
             th:insert="~{ /ui/forms :: textInput(labelText='Phone Number', inputName='phoneNumber', inputType='tel') }"></div>
        <div class="flex flex-col md:flex-row justify-between items-center space-y-2 md:space-y-0">
            <button type="submit"
                    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                Create
            </button>

            <a href="/client" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
