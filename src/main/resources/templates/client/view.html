<!--/*@thymesVar id="client" type="nbu.team11.dtos.ClientDto"*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="clientViewPage">
    <div class="container my-6 lg:my-12 mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-3 space-x-12">
            <div class="col-span-2">
                <div class="bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
                    <div class="border-b-2 border-neutral-100 p-4 dark:border-white/10">
                        <div class="flex justify-between items-center">
                            <h2 class="font-semibold text-lg dark:text-white" th:text="${client.getUserFullName()}">Jane Doe</h2>
                            <div class="flex items-center gap-2">
                                <form th:action="@{'/client/' + ${client.getId()} + '/delete'}"
                                      method="post"
                                      class="inline"
                                      onsubmit="return confirm('Are you sure you want to delete this client? This will anonymize their personal data for GDPR compliance.');">
                                    <button type="submit"
                                            class="flex items-center text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-4 py-2.5 dark:bg-red-600 dark:hover:bg-red-700 focus:outline-none dark:focus:ring-red-800">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                             stroke-width="1.5"
                                             stroke="currentColor" class="size-4 mr-2">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                                        </svg>
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-y-4">
                            <div>
                                <div class="italic text-sm text-gray-600 dark:text-gray-400">phone</div>
                                <div th:text="${client.getPhoneNumber()}">0888123456</div>
                            </div>
                        </div>
                        <div th:if="${client.getAddresses() != null && !client.getAddresses().isEmpty()}">
                            <div class="border-b-2 my-6 lg:my-12 dark:border-white/10"></div>
                            <h3 class="font-semibold text-md mb-4 dark:text-white">Addresses</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div th:each="address : ${client.getAddresses()}"
                                     class="p-4 border border-gray-200 rounded-lg dark:border-gray-700">
                                    <div class="italic text-sm text-gray-600 dark:text-gray-400">address</div>
                                    <div th:text="${address.getFormattedAddress()}">123 Main St</div>
                                    <div class="mt-2">
                                        <div class="italic text-sm text-gray-600 dark:text-gray-400">coordinates</div>
                                        <div th:text="${address.getCoordinates()}">42.6977,23.3219</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
