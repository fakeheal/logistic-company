<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Shipment</title>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const apiBase = /*[[@{/}]]*/ '';
        const allUsers = /*[[${users}]]*/ [];
        /*]]>*/
    </script>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css"/>
</head>

<body>

<div th:fragment="registerShipmentPage">
    <form th:action="@{/client/registerShipment}"
          th:object="${form}"
          method="post"
          class="max-w-lg mx-auto my-12 p-6 bg-white border rounded shadow">

        <h2 class="text-2xl font-bold mb-6">Register Shipment</h2>

        <!-- Weight -->
        <div class="mb-4">
            <label for="weight" class="block mb-1">Weight (kg)</label>
            <input th:field="*{weight}"
                   type="number"
                   step="0.01"
                   id="weight"
                   class="w-full p-2 border rounded"
                   required/>
        </div>

        <!-- Create new address -->
        <div class="mb-4 flex items-center">
            <input th:field="*{createNewAddress}"
                   type="checkbox"
                   id="createNewAddress"
                   class="mr-2"/>
            <label for="createNewAddress">Create New Address</label>
        </div>

        <!-- Profile address (readonly or select) -->
        <div id="profileAddressContainer" class="mb-4">
            <label class="block mb-1">Your Address</label>

            <select th:if="${form.addresses != null and #lists.size(form.addresses) > 0}"
                    th:field="*{selectedSenderAddressId}"
                    id="senderAddressSelect"
                    class="w-full p-2 border rounded">
                <option th:each="addr : ${form.addresses}"
                        th:value="${addr.id}"
                        th:text="${addr.formattedAddress + ' — ' + addr.coordinates}"
                        th:selected="${addr.id == form.selectedSenderAddressId}">
                    Address
                </option>
            </select>

            <input th:if="${form.addresses == null or #lists.size(form.addresses) == 0}"
                   type="text"
                   th:value="${form.senderAddress.formattedAddress}"
                   readonly
                   class="w-full p-2 border rounded bg-gray-100"/>
        </div>

        <!-- Manual sender address -->
        <div id="senderAddressContainer" class="mb-4 hidden">
            <label for="senderAutocomplete" class="block mb-1">Your Address</label>
            <input th:field="*{senderAddress.formattedAddress}"
                   type="text"
                   id="senderAutocomplete"
                   placeholder="Start typing the sender address..."
                   autocomplete="off"
                   class="w-full p-2 border rounded"/>
            <input th:field="*{senderAddress.coordinates}"
                   type="hidden"
                   id="senderCoordinates"/>
        </div>

        <!-- Recipient client autocomplete -->
        <div id="recipientClientContainer" class="mb-4 relative">
            <label for="recipientClientSearch" class="block mb-1">Recipient Client</label>

            <input type="text"
                   id="recipientClientSearch"
                   class="w-full p-2 border rounded"
                   placeholder="Type first/last name or phone…"
                   autocomplete="off" />

            <input type="hidden"
                   th:field="*{recipientClientId}"
                   id="recipientClientId" />

            <div id="recipientClientSuggestions"
                 class="absolute z-10 w-full bg-white border rounded shadow mt-1 max-h-48 overflow-y-auto hidden">
            </div>
        </div>

        <div class="mb-4 flex items-center">
            <input th:field="*{deliverToOffice}"
                   type="checkbox"
                   id="deliverToOffice"
                   class="mr-2"/>
            <label for="deliverToOffice">Deliver to Office</label>
        </div>

        <!-- Office selection -->
        <div id="officeContainer" class="mb-4">
            <label for="officeSelect" class="block mb-1">Select Office</label>
            <select th:field="*{officeId}"
                    id="officeSelect"
                    class="w-full p-2 border rounded">
                <option th:each="office : ${offices}"
                        th:value="${office.id}"
                        th:text="${office.title + ' - ' + office.addressDto.formattedAddress}">
                    Office Name
                </option>
            </select>
        </div>

        <!-- Recipient address (if not office) -->
        <div id="recipientAddressContainer" class="mb-4 hidden">
            <label for="recipientAutocomplete" class="block mb-1">Recipient Address</label>
            <input th:field="*{recipientAddress.formattedAddress}"
                   type="text"
                   id="recipientAutocomplete"
                   placeholder="Start typing recipient address..."
                   autocomplete="off"
                   class="w-full p-2 border rounded"/>
            <input th:field="*{recipientAddress.coordinates}"
                   type="hidden"
                   id="recipientCoordinates"/>
        </div>

        <!-- Calculate Price -->
        <div class="mb-4">
            <button type="button"
                    id="calculatePrice"
                    class="px-4 py-2 bg-blue-600 text-white rounded">
                Calculate Price
            </button>
        </div>

        <div class="mb-4">
            <label class="block mb-1">Price</label>
            <input type="hidden"
                   th:field="*{price}"
                   id="price"/>
            <input type="text"
                   id="priceDisplay"
                   readonly
                   class="w-full p-2 border rounded bg-gray-100 font-semibold"/>
        </div>

        <button type="submit"
                id="submitBtn"
                disabled
                class="px-4 py-2 bg-green-600 text-white rounded disabled:opacity-50">
            Submit
        </button>

    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {

        const form = document.querySelector('form[action="/client/registerShipment"], form[method="post"]') || document.querySelector('form');

        // --- Recipient client autocomplete ---
        const searchInput    = form.querySelector('#recipientClientSearch');
        const hiddenClientId = form.querySelector('#recipientClientId');
        const suggestionsBox = form.querySelector('#recipientClientSuggestions');

        const getCandidateId = (c) => {
            return (c && (c.id ?? c.clientId ?? c.clientDto?.id ?? c.clientDto?.clientId)) ?? null;
        };

        const clearSuggestions = () => {
            suggestionsBox.innerHTML = '';
            suggestionsBox.classList.add('hidden');
        };

        const showSuggestions = (matches) => {
            if (!matches.length) {
                clearSuggestions();
                return;
            }
            suggestionsBox.innerHTML = '';
            matches.slice(0, 10).forEach(c => {
                const phoneNum = (c.clientDto && c.clientDto.phoneNumber) ? c.clientDto.phoneNumber : '';
                const label = `${c.firstName} ${c.lastName}` + (phoneNum ? ` – ${phoneNum}` : '');

                const item  = document.createElement('div');
                item.classList.add('px-2','py-1','hover:bg-gray-200','cursor-pointer');

                const id = getCandidateId(c);
                item.textContent = `${label} (id: ${id})`;
                item.dataset.clientId = id ?? '';

                item.addEventListener('click', () => {
                    searchInput.value = label;
                    hiddenClientId.value = id ?? '';

                    clearSuggestions();
                });

                suggestionsBox.appendChild(item);
            });

            suggestionsBox.classList.remove('hidden');
        };

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim().toLowerCase();

            hiddenClientId.value = '';

            if (!query) {
                clearSuggestions();
                setDebug('');
                return;
            }

            const matches = allUsers.filter(c => {
                const fullName = ((c.firstName ?? '') + ' ' + (c.lastName ?? '')).toLowerCase();
                const phone    = (c.clientDto && c.clientDto.phoneNumber) ? String(c.clientDto.phoneNumber).toLowerCase() : '';
                return fullName.includes(query) || phone.includes(query);
            });

            showSuggestions(matches);
        });

        document.addEventListener('click', (e) => {
            if (!suggestionsBox.contains(e.target) && e.target !== searchInput) clearSuggestions();
        });

        const createNew = form.querySelector('#createNewAddress');
        const profileCont = document.getElementById('profileAddressContainer');
        const senderCont = document.getElementById('senderAddressContainer');
        const senderInput = document.getElementById('senderAutocomplete');

        let senderAutocompleteInitialized = false;

        const toggleSender = () => {
            if (createNew.checked) {
                profileCont.style.display = 'none';
                senderCont.style.display = 'block';

                // initialize Google autocomplete once
                if (!senderAutocompleteInitialized && window.google && google.maps && google.maps.places) {
                    const autocomplete = new google.maps.places.Autocomplete(senderInput);
                    autocomplete.setFields(['formatted_address','geometry']);
                    autocomplete.addListener('place_changed', () => {
                        const place = autocomplete.getPlace();
                        if (!place.geometry) return;
                        senderInput.value = place.formatted_address;
                        document.getElementById('senderCoordinates').value =
                            place.geometry.location.lat() + ',' + place.geometry.location.lng();
                    });
                    senderAutocompleteInitialized = true;
                }

            } else {
                profileCont.style.display = 'block';
                senderCont.style.display = 'none';
            }
        };

        createNew.addEventListener('change', toggleSender);
        toggleSender(); // initialize state

        // --- Toggle deliver to office ---
        const deliverChk = form.querySelector('#deliverToOffice');
        const officeCont = document.getElementById('officeContainer');
        const recipAddr  = document.getElementById('recipientAddressContainer');

        const toggleDeliver = () => {
            if (deliverChk.checked) {
                officeCont.style.display = 'block';
                recipAddr.style.display = 'none';
            } else {
                officeCont.style.display = 'none';
                recipAddr.style.display = 'block';
            }
        };
        deliverChk.addEventListener('change', toggleDeliver);
        toggleDeliver();

        document.getElementById('calculatePrice').addEventListener('click', () => {
            const wt = document.getElementById('weight').value;
            if (!wt) return alert('Enter weight');

            fetch(`/api/shipments/price?weight=${wt}&deliverToOffice=${deliverChk.checked}`)
                .then(r => r.json())
                .then(d => {
                    const numeric = Number(d.price).toFixed(2);
                    document.getElementById('price').value = numeric;          // submitted
                    document.getElementById('priceDisplay').value = numeric + ' EUR'; // shown
                    document.getElementById('submitBtn').disabled = false;
                });
        });

    });
</script>

<script
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initShipmentAutocomplete"
        async defer>
</script>

</body>
</html>
