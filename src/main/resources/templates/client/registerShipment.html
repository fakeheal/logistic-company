<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Shipment</title>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const apiBase = /*[[@{/}]]*/ '';
        const allUsers = /*[[${users}]]*/ [];
        /*]]>*/
    </script>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css"/>
</head>

<body>

<div th:fragment="registerShipmentPage">
    <form th:action="@{/client/registerShipment}"
          th:object="${form}"
          method="post"
          class="max-w-lg mx-auto my-12 p-6 bg-white border rounded shadow">

        <h2 class="text-2xl font-bold mb-6">Register Shipment</h2>

        <!-- Weight -->
        <div class="mb-4">
            <label for="weight" class="block mb-1">Weight (kg)</label>
            <input th:field="*{weight}"
                   type="number"
                   step="0.01"
                   id="weight"
                   class="w-full p-2 border rounded"
                   required/>
        </div>

        <!-- Create new sender address -->
        <div class="mb-4 flex items-center">
            <input th:field="*{createNewAddress}"
                   type="checkbox"
                   id="createNewAddress"
                   class="mr-2"/>
            <label for="createNewAddress">Create New Address</label>
        </div>

        <!-- Profile sender address -->
        <div id="profileAddressContainer" class="mb-4">
            <label class="block mb-1">Your Address</label>

            <select th:if="${form.addresses != null and #lists.size(form.addresses) > 0}"
                    th:field="*{selectedSenderAddressId}"
                    id="senderAddressSelect"
                    class="w-full p-2 border rounded">
                <option th:each="addr : ${form.addresses}"
                        th:value="${addr.id}"
                        th:text="${addr.formattedAddress + ' — ' + addr.coordinates}">
                </option>
            </select>

            <input th:if="${form.addresses == null or #lists.size(form.addresses) == 0}"
                   type="text"
                   th:value="${form.senderAddress.formattedAddress}"
                   readonly
                   class="w-full p-2 border rounded bg-gray-100"/>
        </div>

        <!-- Manual sender address -->
        <div id="senderAddressContainer" class="mb-4 hidden">
            <label for="senderAutocomplete" class="block mb-1">Your Address</label>
            <input th:field="*{senderAddress.formattedAddress}"
                   type="text"
                   id="senderAutocomplete"
                   autocomplete="off"
                   class="w-full p-2 border rounded"/>
            <input th:field="*{senderAddress.coordinates}"
                   type="hidden"
                   id="senderCoordinates"/>
        </div>

        <!-- Recipient client autocomplete -->
        <div class="mb-4 relative">
            <label class="block mb-1">Recipient Client</label>

            <input type="text"
                   id="recipientClientSearch"
                   class="w-full p-2 border rounded"
                   placeholder="Type first/last name or phone…"
                   autocomplete="off"/>

            <input type="hidden"
                   th:field="*{recipientClientId}"
                   id="recipientClientId"/>

            <div id="recipientClientSuggestions"
                 class="absolute z-10 w-full bg-white border rounded shadow mt-1 max-h-48 overflow-y-auto hidden">
            </div>
        </div>

        <!-- Deliver to office -->
        <div class="mb-4 flex items-center">
            <input th:field="*{deliverToOffice}"
                   type="checkbox"
                   id="deliverToOffice"
                   class="mr-2"/>
            <label for="deliverToOffice">Deliver to Office</label>
        </div>

        <!-- Office selection -->
        <div id="officeContainer" class="mb-4">
            <label class="block mb-1">Select Office</label>
            <select th:field="*{officeId}"
                    id="officeSelect"
                    class="w-full p-2 border rounded">
                <option th:each="office : ${offices}"
                        th:value="${office.id}"
                        th:text="${office.title + ' - ' + office.addressDto.formattedAddress}">
                </option>
            </select>
        </div>

        <!-- Recipient address dropdown ONLY -->
        <div id="recipientAddressSelectContainer" class="mb-4 hidden">
            <label class="block mb-1">Recipient Address</label>
            <select th:field="*{selectedRecipientAddressId}"
                    id="recipientAddressSelect"
                    class="w-full p-2 border rounded">
                <option value="">Select recipient address</option>
            </select>
        </div>

        <!-- Calculate price -->
        <div class="mb-4">
            <button type="button"
                    id="calculatePrice"
                    class="px-4 py-2 bg-blue-600 text-white rounded">
                Calculate Price
            </button>
        </div>

        <div class="mb-4">
            <label class="block mb-1">Price</label>
            <input type="hidden" th:field="*{price}" id="price"/>
            <input type="text"
                   id="priceDisplay"
                   readonly
                   class="w-full p-2 border rounded bg-gray-100 font-semibold"/>
        </div>

        <button type="submit"
                id="submitBtn"
                disabled
                class="px-4 py-2 bg-green-600 text-white rounded disabled:opacity-50">
            Submit
        </button>

    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {

        /* ---------- Recipient client autocomplete ---------- */
        const searchInput = document.getElementById('recipientClientSearch');
        const hiddenClientId = document.getElementById('recipientClientId');
        const suggestionsBox = document.getElementById('recipientClientSuggestions');

        const recipAddrCont = document.getElementById('recipientAddressSelectContainer');
        const recipSelect = document.getElementById('recipientAddressSelect');

        const getUserId = (u) =>
            u?.id ?? u?.clientId ?? u?.clientDto?.id ?? u?.clientDto?.clientId ?? null;

        const clearSuggestions = () => {
            suggestionsBox.innerHTML = '';
            suggestionsBox.classList.add('hidden');
        };

        const loadRecipientAddresses = (clientId) => {
            fetch(`/api/clients/${clientId}/addresses`)
                .then(r => r.json())
                .then(addresses => {
                    recipSelect.innerHTML = '<option value="">Select recipient address</option>';

                    if (!addresses.length) {
                        alert('Recipient has no saved addresses');
                        recipAddrCont.classList.add('hidden');
                        return;
                    }

                    addresses.forEach(a => {
                        const opt = document.createElement('option');
                        opt.value = a.id;
                        opt.textContent = a.formattedAddress;
                        recipSelect.appendChild(opt);
                    });
                    if (!deliverChk.checked) {
                       recipAddrCont.classList.remove('hidden');
                    }
                });
        };

        searchInput.addEventListener('input', () => {
            const q = searchInput.value.toLowerCase().trim();
            hiddenClientId.value = '';
            recipAddrCont.classList.add('hidden');

            if (!q) return clearSuggestions();

            const matches = allUsers.filter(u =>
                (`${u.firstName} ${u.lastName}`.toLowerCase().includes(q) ||
                 (u.clientDto?.phoneNumber ?? '').toString().includes(q))
            );

            suggestionsBox.innerHTML = '';
            matches.slice(0, 10).forEach(u => {
                const div = document.createElement('div');
                div.className = 'px-2 py-1 cursor-pointer hover:bg-gray-200';
                div.textContent = `${u.firstName} ${u.lastName}`;

                div.onclick = () => {
                    const id = getUserId(u);
                    if (!id) return alert('Invalid recipient');

                    searchInput.value = div.textContent;
                    hiddenClientId.value = id;
                    clearSuggestions();
                    loadRecipientAddresses(id);
                };

                suggestionsBox.appendChild(div);
            });

            suggestionsBox.classList.remove('hidden');
        });

        document.addEventListener('click', e => {
            if (!suggestionsBox.contains(e.target) && e.target !== searchInput)
                clearSuggestions();
        });

        /* ---------- Sender address toggle ---------- */
        const createNew = document.getElementById('createNewAddress');
        const profileCont = document.getElementById('profileAddressContainer');
        const senderCont = document.getElementById('senderAddressContainer');

        createNew.addEventListener('change', () => {
        profileCont.style.display = createNew.checked ? 'none' : 'block';
        senderCont.style.display = createNew.checked ? 'block' : 'none';

        if (createNew.checked) {
            initSenderAutocomplete();
        }
        });


         /* ---------- Google Places: sender ---------- */
        const senderInput = document.getElementById('senderAutocomplete');
        const senderCoords = document.getElementById('senderCoordinates');

        let senderAutocompleteInit = false;

        const initSenderAutocomplete = () => {
            if (senderAutocompleteInit || !window.google) return;

        const autocomplete = new google.maps.places.Autocomplete(senderInput);
        autocomplete.setFields(['formatted_address', 'geometry']);

        autocomplete.addListener('place_changed', () => {
            const place = autocomplete.getPlace();
            if (!place.geometry) return;

            senderInput.value = place.formatted_address;
            senderCoords.value =
                place.geometry.location.lat() + ',' +
                place.geometry.location.lng();
        });

        senderAutocompleteInit = true;
        };


        /* ---------- Deliver to office toggle ---------- */
        const deliverChk = document.getElementById('deliverToOffice');
        const officeCont = document.getElementById('officeContainer');

        const toggleDeliver = () => {
            if (deliverChk.checked) {
                officeCont.style.display = 'block';
                recipAddrCont.classList.add('hidden');
            } else {
                officeCont.style.display = 'none';
            }
        };

        deliverChk.addEventListener('change', toggleDeliver);
        toggleDeliver();

        /* ---------- Price ---------- */
        document.getElementById('calculatePrice').onclick = () => {
            const wt = document.getElementById('weight').value;
            if (!wt) return alert('Enter weight');

            fetch(`/api/shipments/price?weight=${wt}&deliverToOffice=${deliverChk.checked}`)
                .then(r => r.json())
                .then(d => {
                    const v = Number(d.price).toFixed(2);
                    document.getElementById('price').value = v;
                    document.getElementById('priceDisplay').value = v + ' EUR';
                    document.getElementById('submitBtn').disabled = false;
                });
        };

    });
    /*]]>*/
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAxIJvVWlMNNR22-FzoJshWD5kthDBtaaU&libraries=places" async defer></script>

</body>
</html>
