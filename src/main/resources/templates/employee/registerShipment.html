<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Shipment</title>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const allUsers = /*[[${users}]]*/ [];
        /*]]>*/
    </script>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css"/>
</head>

<body>

<form th:action="@{/employee/registerShipment}"
      th:object="${form}"
      method="post"
      class="max-w-lg mx-auto my-12 p-6 bg-white border rounded shadow dark:bg-gray-800 dark:border-gray-700">

    <h2 class="text-2xl font-bold mb-6 dark:text-white">Register Shipment</h2>

    <!-- Weight -->
    <div class="mb-4">
        <label class="block mb-1 dark:text-gray-300">Weight (kg)</label>
        <input th:field="*{weight}"
               type="number"
               step="0.01"
               class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400"
               required/>
    </div>

    <!-- Sender client -->
    <div class="mb-4 relative">
        <label class="block mb-1 dark:text-gray-300">Sender Client</label>
        <input type="text" id="senderClientSearch"
               class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400"
               placeholder="Type name or phone…" autocomplete="off"/>
        <input type="hidden" th:field="*{senderClientId}" id="senderClientId"/>
        <div id="senderClientSuggestions"
             class="absolute w-full bg-white border rounded shadow hidden max-h-40 overflow-y-auto dark:bg-gray-700 dark:border-gray-600"></div>
    </div>

    <!-- Sending office -->
    <div class="mb-4">
        <label class="block mb-1 dark:text-gray-300">Sending Office</label>
        <select th:field="*{sendingOfficeId}"
                class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
            <option value="">Select office</option>
            <option th:each="office : ${offices}"
                    th:value="${office.id}"
                    th:text="${office.title + ' - ' + office.addressDto.formattedAddress}">
            </option>
        </select>
    </div>

    <!-- Recipient client -->
    <div class="mb-4 relative">
        <label class="block mb-1 dark:text-gray-300">Recipient Client</label>
        <input type="text" id="recipientClientSearch"
               class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:placeholder-gray-400"
               placeholder="Type name or phone…" autocomplete="off"/>
        <input type="hidden" th:field="*{recipientClientId}" id="recipientClientId"/>
        <div id="recipientClientSuggestions"
             class="absolute w-full bg-white border rounded shadow hidden max-h-40 overflow-y-auto dark:bg-gray-700 dark:border-gray-600"></div>
    </div>

    <!-- Deliver to office -->
    <div class="mb-4 flex items-center">
        <input th:field="*{deliverToOffice}" type="checkbox" id="deliverToOffice" class="mr-2"/>
        <label class="dark:text-gray-300">Deliver to Office</label>
    </div>

    <!-- Receiving office -->
    <div id="officeContainer" class="mb-4">
        <label class="block mb-1 dark:text-gray-300">Receiving Office</label>
        <select th:field="*{officeId}" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <option th:each="office : ${offices}"
                    th:value="${office.id}"
                    th:text="${office.title + ' - ' + office.addressDto.formattedAddress}">
            </option>
        </select>
    </div>

    <!-- Recipient address dropdown -->
    <div id="recipientAddressSelectContainer" class="mb-4 hidden">
        <label class="block mb-1 dark:text-gray-300">Recipient Address</label>
        <select th:field="*{selectedRecipientAddressId}"
                id="recipientAddressSelect"
                class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <option value="">Select recipient address</option>
        </select>
    </div>

    <!-- Price -->
    <div class="mb-4">
        <button type="button" id="calculatePrice"
                class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-700">
            Calculate Price
        </button>
    </div>

    <div class="mb-4">
        <label class="block mb-1 dark:text-gray-300">Price</label>
        <input type="hidden" th:field="*{price}" id="price"/>
        <input type="text" id="priceDisplay" readonly
               class="w-full p-2 border rounded bg-gray-100 font-semibold dark:bg-gray-600 dark:border-gray-600 dark:text-white"/>
    </div>

    <button type="submit" id="submitBtn"
            disabled
            class="px-4 py-2 bg-green-600 text-white rounded disabled:opacity-50 hover:bg-green-700 dark:bg-green-600 dark:hover:bg-green-700">
        Submit
    </button>

</form>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {

        const deliverChk = document.getElementById('deliverToOffice');
        const officeCont = document.getElementById('officeContainer');
        const recipAddrCont = document.getElementById('recipientAddressSelectContainer');
        const recipSelect = document.getElementById('recipientAddressSelect');

        const setupAutocomplete = (inputId, hiddenId, boxId, onSelect) => {
            const input = document.getElementById(inputId);
            const hidden = document.getElementById(hiddenId);
            const box = document.getElementById(boxId);

            input.addEventListener('input', () => {
                const q = input.value.toLowerCase().trim();
                hidden.value = '';
                box.innerHTML = '';
                box.classList.add('hidden');

                if (!q) return;

                const matches = allUsers.filter(u =>
                    (`${u.firstName} ${u.lastName}`.toLowerCase().includes(q) ||
                     (u.clientDto?.phoneNumber ?? '').toString().includes(q))
                );

                matches.slice(0, 10).forEach(u => {
                    const div = document.createElement('div');
                    div.className = 'px-2 py-1 hover:bg-gray-200 cursor-pointer dark:text-white dark:hover:bg-gray-600';
                    div.textContent = `${u.firstName} ${u.lastName}`;
                    div.onclick = () => {
                        const id = u.id ?? u.clientDto?.id;
                        input.value = div.textContent;
                        hidden.value = id;
                        box.classList.add('hidden');
                        onSelect?.(id);
                    };
                    box.appendChild(div);
                });

                box.classList.remove('hidden');
            });

            document.addEventListener('click', e => {
                if (!box.contains(e.target) && e.target !== input) box.classList.add('hidden');
            });
        };

        setupAutocomplete('senderClientSearch', 'senderClientId', 'senderClientSuggestions');
        setupAutocomplete(
            'recipientClientSearch',
            'recipientClientId',
            'recipientClientSuggestions',
            loadRecipientAddresses
        );

        function loadRecipientAddresses(clientId) {
            fetch(`/api/clients/${clientId}/addresses`)
                .then(r => r.json())
                .then(addresses => {
                    recipSelect.innerHTML = '<option value="">Select recipient address</option>';
                    if (!addresses.length) return;

                    addresses.forEach(a => {
                        const opt = document.createElement('option');
                        opt.value = a.id;
                        opt.textContent = a.formattedAddress;
                        recipSelect.appendChild(opt);
                    });

                    if (!deliverChk.checked) {
                        recipAddrCont.classList.remove('hidden');
                    }
                });
        }

        const toggleDeliver = () => {
            if (deliverChk.checked) {
                officeCont.style.display = 'block';
                recipAddrCont.classList.add('hidden');
            } else {
                officeCont.style.display = 'none';
                if (document.getElementById('recipientClientId').value) {
                    recipAddrCont.classList.remove('hidden');
                }
            }
        };

        deliverChk.addEventListener('change', toggleDeliver);
        toggleDeliver();

        document.getElementById('calculatePrice').onclick = () => {
            const wt = document.getElementById('weight').value;
            if (!wt) return alert('Enter weight');

            fetch(`/api/shipments/price?weight=${wt}&deliverToOffice=${deliverChk.checked}`)
                .then(r => r.json())
                .then(d => {
                    const v = Number(d.price).toFixed(2);
                    document.getElementById('price').value = v;
                    document.getElementById('priceDisplay').value = v + ' EUR';
                    document.getElementById('submitBtn').disabled = false;
                });
        };
    });
    /*]]>*/
</script>

</body>
</html>
