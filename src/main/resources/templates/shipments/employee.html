<div class="container mx-auto my-12 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
    <div class="border-b-2 border-neutral-100 p-4 dark:border-white/10">
        <div class="flex justify-between items-center">
            <form th:action="@{/shipments/all}" method="get" class="flex gap-2 items-center">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                        </svg>
                    </div>
                    <input type="text" name="search" th:value="${search}"
                           class="block w-full md:w-80 p-2 pl-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                           placeholder="Search by client or office name..."/>
                </div>
                <select name="status"
                        class="block p-2 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                    <option value="">All statuses</option>
                    <option th:each="st : ${statuses}"
                            th:value="${st}"
                            th:text="${st}"
                            th:selected="${selectedStatus != null and selectedStatus == st}">
                    </option>
                </select>
                <button type="submit"
                        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">
                    Search
                </button>
                <a th:if="${(search != null and !search.isEmpty()) or selectedStatus != null}" th:href="@{/shipments/all}"
                   class="text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-4 py-2 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700">
                    Clear
                </a>
            </form>
            <a href="/employee/registerShipment"
               class="flex items-center text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                     stroke="currentColor" class="size-4 mr-2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                </svg>
                New Shipment
            </a>
        </div>
    </div>
    <div class="relative overflow-x-auto">
        <table class="w-full border-collapse" id="shipmentsTable">

            <thead>
            <tr class="bg-gray-50 dark:bg-gray-600 text-gray-700 dark:text-gray-200 text-xs uppercase">
                <th class="px-6 py-4 text-left">Tracking ID</th>
                <th class="px-6 py-4 text-left">Sender</th>
                <th class="px-6 py-4 text-left">Recipient</th>
                <th class="px-6 py-4 text-left">Office</th>
                <th class="px-6 py-4 text-left">Status</th>
                <th class="px-6 py-4 text-left">Paid</th>
            </tr>
            </thead>

            <tbody class="text-gray-700 dark:text-white">

            <tr th:each="shipment : ${shipments}">

                <td class="px-6 py-4 text-sm font-mono">
                    <a th:href="@{/shipments/{id}(id=${shipment.id})}"
                       th:text="${shipment.uniqueID}"
                       class="text-blue-600 dark:text-blue-400 hover:underline">
                    </a>
                </td>

                <td class="px-6 py-4 text-sm"
                    th:text="${shipment.senderClient?.userFullName}">
                </td>

                <td class="px-6 py-4 text-sm"
                    th:text="${shipment.recipientClient?.userFullName}">
                </td>

                <td class="px-6 py-4 text-sm"
                    th:text="${shipment.receivingOffice != null
                                  ? shipment.receivingOffice.title
                                  : '—'}">
                </td>

                <td class="px-6 py-4 text-sm font-medium"
                    th:text="${shipment.status}">
                </td>

                <td class="px-6 py-4 text-sm">
                    <span th:if="${shipment.payed}" class="text-green-600 dark:text-green-400">&#10003;</span>
                    <span th:if="${!shipment.payed}" class="text-red-500">Not paid</span>
                </td>

            </tr>

            </tbody>
        </table>
    </div>
</div>
