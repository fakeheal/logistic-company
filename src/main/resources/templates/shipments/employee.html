<section class="container mx-auto p-6 font-mono">

    <div class="bg-white rounded-2xl shadow-md overflow-hidden">

        <div class="p-5">
            <input id="shipmentSearch"
                   type="text"
                   placeholder="Search shipments (employee, recipient, status, ID...)"
                   class="w-full px-5 py-3 rounded-xl border border-gray-200
                          focus:outline-none focus:ring-2 focus:ring-blue-500"
                   onkeyup="filterShipments()" />
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border-collapse" id="shipmentsTable">

                <thead>
                <tr class="bg-gray-50 text-gray-700 text-sm uppercase">
                    <th class="px-6 py-4 text-left">Employee</th>
                    <th class="px-6 py-4 text-left">Recipient</th>
                    <th class="px-6 py-4 text-left">Recipient Address</th>
                    <th class="px-6 py-4 text-left">Sender</th>
                    <th class="px-6 py-4 text-left">Sender Address</th>
                    <th class="px-6 py-4 text-left">Price</th>
                    <th class="px-6 py-4 text-left">Weight</th>
                    <th class="px-6 py-4 text-left">Office</th>
                    <th class="px-6 py-4 text-left">Status</th>
                    <th class="px-6 py-4 text-left">Tracking ID</th>
                    <th class="px-6 py-4 text-left">Assign</th>
                    <th class="px-6 py-4 text-left">Set Status</th>
                </tr>
                </thead>

                <tbody class="text-gray-700">

                <tr th:each="shipment : ${shipments}"
                    class="hover:bg-gray-50 transition">

                    <td class="px-6 py-4 text-sm"
                        th:text="${shipment.employee != null
                                  ? shipment.employee.userFullName
                                  : 'Unassigned'}">
                    </td>

                    <td class="px-6 py-4 text-sm"
                        th:text="${shipment.recipientClient?.userFullName}">
                    </td>

                    <td class="px-6 py-4 text-sm"
                        th:text="${shipment.recipientAddress?.formattedAddress}">
                    </td>

                    <td class="px-6 py-4 text-sm"
                        th:text="${shipment.senderClient?.userFullName}">
                    </td>

                    <td class="px-6 py-4 text-sm"
                        th:text="${shipment.senderAddress?.formattedAddress}">
                    </td>

                    <td class="px-6 py-4 text-sm font-medium"
                        th:text="${shipment.price + ' EUR'}">
                    </td>

                    <td class="px-6 py-4 text-sm"
                        th:text="${shipment.weight + ' kg'}">
                    </td>

                    <td class="px-6 py-4 text-sm"
                        th:text="${shipment.receivingOffice != null
                                  ? shipment.receivingOffice.title
                                  : '—'}">
                    </td>

                    <td class="px-6 py-4 text-sm font-medium"
                        th:text="${shipment.status}">
                    </td>

                    <td class="px-6 py-4 text-sm font-mono"
                        th:text="${shipment.uniqueID}">
                    </td>

                    <td class="px-6 py-4 text-sm">
                        <form th:if="${employees != null}"
                              th:action="@{/shipments/{id}/assign(id=${shipment.id})}"
                              method="post"
                              class="space-y-1">

                            <select name="employeeId"
                                    class="w-full text-sm border rounded-lg px-2 py-1">
                                <option disabled selected>Assign</option>
                                <option th:each="emp : ${employees}"
                                        th:value="${emp.id}"
                                        th:text="${emp.userFullName}">
                                </option>
                            </select>

                            <button type="submit"
                                    class="w-full bg-gray-100 hover:bg-gray-200
                                           rounded-lg py-1 text-xs">
                                Assign
                            </button>
                        </form>
                    </td>

                    <td class="px-6 py-4 text-sm">

                        <form th:if="${shipment.payed}"
                              th:action="@{/shipments/{id}/status(id=${shipment.id})}"
                              method="post"
                              class="space-y-1">

                            <select name="status"
                                    class="w-full text-sm border rounded-lg px-2 py-1">
                                <option th:each="st : ${statuses}"
                                        th:value="${st}"
                                        th:text="${st}">
                                </option>
                            </select>

                            <button type="submit"
                                    class="w-full bg-blue-600 hover:bg-blue-700
                                           text-white rounded-lg py-1 text-xs">
                                Update
                            </button>
                        </form>

                        <p th:if="${!shipment.payed}"
                           class="text-xs text-red-500 text-center mt-1">
                            Not paid
                        </p>

                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>
</section>

<script>
    function filterShipments() {
        const filter = document.getElementById("shipmentSearch").value.toLowerCase();
        document.querySelectorAll("#shipmentsTable tbody tr")
            .forEach(row =>
                row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none"
            );
    }
</script>
