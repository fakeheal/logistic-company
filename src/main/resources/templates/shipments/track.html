<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="trackPage">

    <div class="max-w-lg mx-auto mt-24 mb-6 bg-white dark:bg-gray-800 rounded-2xl shadow-md p-6">
        <form action="/track" method="get" class="flex">
            <input
                    type="text"
                    id="shipmentId"
                    name="shipmentId"
                    required
                    placeholder="Enter tracking number..."
                    class="flex-1 px-4 py-3 rounded-l-xl border border-gray-200 dark:border-gray-600
                       bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                       placeholder-gray-400 dark:placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-500"
                    th:value="${shipmentId}"
            />

            <button
                    type="submit"
                    class="px-6 py-3 bg-blue-600 dark:bg-blue-600 text-white rounded-r-xl
                       hover:bg-blue-700 dark:hover:bg-blue-700 transition font-medium">
                Track
            </button>
        </form>
    </div>

    <div th:if="${error}"
         class="max-w-lg mx-auto mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800
                text-red-700 dark:text-red-400 rounded-xl p-4 text-center">
        <p th:text="${error}"></p>
    </div>

    <div th:if="${shipmentStatuses != null}"
         class="max-w-lg mx-auto mb-24 bg-white dark:bg-gray-800 rounded-2xl shadow-md p-6">

        <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-1">
            Shipment Progress
        </h2>

        <p class="text-sm font-medium text-blue-600 dark:text-blue-400 mb-6"
           th:text="${#strings.capitalizeWords(
                #strings.replace(
                    shipmentStatuses[shipmentStatuses.size() - 1].status.name(),
                    '_',
                    ' '
                ).toLowerCase()
            )}">
        </p>


        <ol class="relative border-s border-gray-200 dark:border-gray-700">
            <li th:each="shipmentStatus : ${shipmentStatuses}"
                class="mb-8 ms-6">

        <span class="absolute -start-3 flex h-6 w-6 items-center
                     justify-center rounded-full bg-blue-600 dark:bg-blue-500">
        </span>

                <div class="flex items-center mb-1">
                    <time class="text-sm text-gray-400 dark:text-gray-500"
                          th:text="${#temporals.format(shipmentStatus.createdOn,
                  'dd MMM yyyy HH:mm')}">
                    </time>
                    <span class="text-gray-300 dark:text-gray-600">&nbsp;•&nbsp;</span>
                    <span class="text-sm font-medium text-blue-600 dark:text-blue-400"
                          th:text="${#strings.capitalizeWords(
               #strings.replace(
                   shipmentStatus.status.name(),
                   '_',
                   ' '
               ).toLowerCase()
           )}">
              </span>
                </div>


                <h3 class="text-md font-medium text-gray-900 dark:text-gray-100"
                    th:text="${shipmentStatus.comment != null
                      ? shipmentStatus.comment
                      : shipmentStatus.status}">
                </h3>
            </li>
        </ol>
    </div>
</div>
</body>
</html>
